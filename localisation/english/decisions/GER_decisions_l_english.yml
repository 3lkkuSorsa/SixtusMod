 GER_red_scare: "Red Scare"
 GER_red_scare_desc: "The growing influence and popularity of the §RKPD§! and other §tsocialist§! parties has resulted in a mass campaign of fear and propaganda against them, mainly from the conservatives and right-wing groups. This campaign has resulted in a collection of legislation known as the §Ycommunist laws§! which limit and restrict the activites and campaigning of parties and groups deemed communist."

 GER_spring_coalition_category: "Spring Coalition"
 GER_spring_coalition_category_desc: "[Get_GER_spring_coalition_desc]"

 GER_spring_coalition_category_desc_kampf_aus_der_mitte: "The §YSpring§! §3coalition§! is currently fighting for its survival against the Zentrum's §tleft-wing§! faction and other §tleftist§! political groups. \n\nCoalition stability: [?GER.coalition_stability|+=0..0$]\n\n§YZentrum's factions§!\n§3Right-wing§!: 77 seats\n§YCenter§!: 70 seats\n§tLeft-wing§!: 53 seats\n\nCurrently §Y[?GER.centrists_for_left]§! of the centrists are siding against the §YSpring§! §3coalition§! and siding with the left-wing faction. Every month, amount of centrists relative to the §Ycoalition stability§! will start supporting or opposing the §tleft-wing§!.\n\n §tIf atleast §!§Y25 Centrists§!§t side with the left, our coalition will fall apart.§!\n\n Completing §YRepeal Anti-Trade Union Legislation§!, §YExpand Worker Protections§!, §YImperial Mediation§! and defeating or allying Schleicher will §Yblock the leftists from attacking our coalition stability§!."

 GER_forming_a_cabinet_category: "Forming a Cabinet"
 GER_forming_a_cabinet_category_desc: "Current §Ycabinet positions§!:\n - Reichskanzler: [GER_VBChancellorT]\n - Interior Minister: [GER_VBInteriorT]\n - Economic Minister: [GER_VBEconomicT]\n - Finance Minister: [GER_VBFinanceT]\n - Foreign Minister: [GER_VBForeignT]\n - Reichswehrminister: [GER_VBArmyT]\n\n§YCabinet balance§!:\n - §3Z§!: [?zentrum_current_cab_seats]/[?zentrum_cab_seats] seats\n - §tSPD§!: [?spd_current_cab_seats]/[?spd_cab_seats] seats\n - §9FVP§!: [?fvp_current_cab_seats]/[?fvp_cab_seats] seats"

 GER_RHI_unification_category: "Situation in the Rhineland"
 GER_RHI_unification_category_desc: "Rhineland has been an semi-independent state since the end of the First World War, and it has been a constant source of tension and conflict between Germany and France. The Rhineland's government is currently divided on the issue of unification with Germany, with some factions advocating for it and others opposing it. However, the unification fervour is only increasing in the region, and only time will tell if the Rhineland will finally rejoin Germany."
