 GER_wilhelm_ii: "Wilhelm II"
 GER_wilhelm_ii_desc: "Born in 1859, Wilhelm II is one of the longest reigning monarchs in Europe. He ascended to the throne in 1888 and has ruled Germany for almost 50 years. His reign has been marked by the largest war known to mankind, the Great War, which left his empire in ruins. After the war, he succeeded in maintaining his regime by conceding to the demands of the democratic opposition and stepping away from day-to-day politics."
