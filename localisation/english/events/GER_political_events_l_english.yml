 GER_spring_coalition.0.d: "Yet another coalition formed by an imperial directive has fallen. This time the kaiser has asked Franz von Papen to try to form a technocratic government, rather than a Zentrum-led minority government. This coalition will be immensly unpopular as it is undemocratic and continues an era of imperial cabinets and instability. This will be seen immediatly, as the Spring coalition, a coalition of parties from the centre to the nationalist right has decided to call for a vote of no confidence against the new government, and will try to oust it as soon as possible. Even Zentrum, Papen's own party is planning to support the initiative to oust Papen."